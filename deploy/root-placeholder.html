<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8ed">
  <meta name="robots" content="noindex">
  <title>Baratos da China | Em breve</title>
  <style>
    :root{--red:#f21d0b;--ink:#11100f;--cream:#fff8ed;--muted:#746d64}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(1px);pointer-events:none}
    body::before{width:260px;height:260px;top:-150px;right:-120px;background:rgba(242,29,11,.08)}
    body::after{width:190px;height:190px;bottom:-120px;left:-90px;background:rgba(242,29,11,.06)}
    main{min-height:100svh;display:grid;place-items:center;padding:32px 22px calc(32px + env(safe-area-inset-bottom))}
    .brand{text-align:center;width:min(100%,420px)}
    .logo{display:block;width:min(78vw,330px);height:auto;margin:0 auto 24px;filter:drop-shadow(0 18px 26px rgba(50,20,10,.08))}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;padding:7px 12px;border:1px solid rgba(242,29,11,.18);border-radius:999px;background:rgba(255,255,255,.62);color:var(--red);font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(242,29,11,.1)}
    h1{margin:0;font-size:clamp(1.8rem,8vw,2.8rem);line-height:1.06;letter-spacing:-.045em}
    p{max-width:330px;margin:13px auto 0;color:var(--muted);font-size:.96rem;line-height:1.6}
    .rule{display:flex;align-items:center;justify-content:center;gap:9px;margin:26px auto 0;color:var(--red)}
    .rule::before,.rule::after{content:"";width:34px;height:3px;border-radius:99px;background:currentColor}
    .rule span{width:7px;height:7px;border-radius:50%;background:currentColor}
    @media (min-width:700px){main{padding:48px}.logo{width:350px}.brand{width:480px}}
    @media (prefers-reduced-motion:no-preference){.brand{animation:enter .55s ease-out both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main>
    <section class="brand" aria-labelledby="coming-title">
      <img class="logo" src="/brand-assets/baratos-da-china-logo.png" width="1254" height="1254" alt="Baratos da China">
      <span class="eyebrow">Estamos preparando tudo</span>
      <h1 id="coming-title">Uma nova loja está chegando.</h1>
      <p>Produtos que surpreendem, preços que cabem no bolso e uma experiência feita primeiro para o seu celular.</p>
      <div class="rule" aria-hidden="true"><span></span></div>
    </section>
  </main>
</body>
</html>
